<style>
@import url('https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400&display=swap');
#haraka-pattern { --hp-bg: light-dark(#f8f7f3,#182321); --hp-paper: light-dark(#ffffff,#23312d); --hp-ink: light-dark(#173d34,#edf5f0); --hp-muted: light-dark(#5c716a,#adc2b8); --hp-green: light-dark(#1c6550,#9ddac0); --hp-soft: light-dark(#e8f2eb,#304e41); --hp-line: light-dark(#dbe4dc,#425d50); --hp-error: light-dark(#a73325,#ffb0a6); font-family: system-ui,sans-serif; color: var(--hp-ink); padding: 16px; }
#haraka-pattern .hp-screen { width: min(100%,380px); margin: 0 auto; box-sizing: border-box; padding: 24px; background: var(--hp-bg); border: 1px solid var(--hp-line); border-radius: 28px; }
#haraka-pattern .hp-kicker { font-size: 14px; color: var(--hp-muted); margin-bottom: 8px; }
#haraka-pattern .hp-title { font-size: 24px; font-weight: 500; line-height: 1.3; margin: 0 0 24px; }
#haraka-pattern .hp-label { font-size: 14px; color: var(--hp-muted); margin-bottom: 12px; }
#haraka-pattern .hp-sounds { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; margin-bottom: 24px; }
#haraka-pattern button { font: inherit; color: var(--hp-ink); border: 1px solid var(--hp-line); background: var(--hp-paper); border-radius: 16px; min-height: 48px; }
#haraka-pattern .hp-sound { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 12px 4px; font-size: 14px; }
#haraka-pattern .hp-sound[aria-pressed=true] { background: var(--hp-soft); border-color: var(--hp-green); }
#haraka-pattern .hp-sound svg { width: 20px; height: 20px; }
#haraka-pattern .hp-word { font-family: 'Scheherazade New',serif; font-size: 80px; line-height: 1.7; text-align: center; background: var(--hp-paper); border-radius: 20px; padding: 12px 16px; margin-bottom: 24px; white-space: nowrap; }
#haraka-pattern .hp-letter { border-bottom: 3px solid transparent; }
#haraka-pattern .hp-letter.hp-active { color: var(--hp-green); border-bottom-color: var(--hp-green); }
#haraka-pattern .hp-letter.hp-wrong { color: var(--hp-error); }
#haraka-pattern .hp-signs { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; margin-bottom: 16px; }
#haraka-pattern .hp-sign { font-family: 'Scheherazade New',serif; font-size: 40px; line-height: 1.7; height: 80px; }
#haraka-pattern .hp-sign[aria-pressed=true] { border-color: var(--hp-green); background: var(--hp-soft); }
#haraka-pattern .hp-check { width: 100%; color: var(--hp-bg); background: var(--hp-green); border: 0; font-weight: 500; }
#haraka-pattern .hp-check:disabled { opacity: .45; }
#haraka-pattern .hp-feedback { font-size: 14px; line-height: 1.5; min-height: 44px; padding-top: 12px; color: var(--hp-muted); }
@media(max-width:360px) { #haraka-pattern { padding: 8px; } #haraka-pattern .hp-screen { padding: 16px; } }
</style>

<script>
(() => {
  const root = document.getElementById('haraka-pattern');
  const bases = ['ش','ر','ب'];
  const expected = ['َ','ِ','َ'];
  const ordinal = ['первой','второй','третьей'];
  const sounds = [...root.querySelectorAll('[data-index]')];
  const letters = [...root.querySelectorAll('[data-letter]')];
  const signs = [...root.querySelectorAll('[data-sign]')];
  const audio = [...root.querySelectorAll('[data-recording]')];
  const check = root.querySelector('[data-check]');
  const feedback = root.querySelector('[data-feedback]');
  const position = root.querySelector('[data-position]');
  let active = 0, chosen = [null,null,null], checked = false;
  function restore(state) {
    const x = state?.privateContent;
    if (!x || !Array.isArray(x.chosen) || x.chosen.length !== 3) return;
    chosen = x.chosen.map(s => expected.includes(s) || s === 'ُ' ? s : null);
    active = Number.isInteger(x.active) && x.active >= 0 && x.active < 3 ? x.active : 0;
    checked = x.checked === true;
  }
  function persist() {
    if (window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{exercise:'Перенос узора огласовок',word:bases.map((b,i)=>b+(chosen[i]||'')).join(''),checked},privateContent:{chosen,active,checked}}).catch(()=>{});
  }
  function render() {
    const complete = chosen.every(Boolean);
    const correct = chosen.every((s,i)=>s===expected[i]);
    letters.forEach((el,i)=>{
      el.textContent = bases[i]+(chosen[i]||'');
      el.classList.toggle('hp-active', i===active && !(checked&&correct));
      el.classList.toggle('hp-wrong', checked && chosen[i]!==expected[i]);
    });
    sounds.forEach((el,i)=>el.setAttribute('aria-pressed',String(i===active)));
    signs.forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.sign===chosen[active])));
    check.disabled = !complete || (checked&&correct);
    position.textContent = checked&&correct ? 'Все три огласовки на месте' : `Выберите знак для ${ordinal[active]} буквы`;
    feedback.textContent = checked ? (correct ? 'Верно! Получилось شَرِبَ.' : 'Исправьте отмеченные знаки. Верные остаются на месте.') : 'Каждый звук можно послушать ещё раз.';
  }
  sounds.forEach((button,i)=>button.addEventListener('click',()=>{
    active=i; audio.forEach(a=>{a.pause();a.currentTime=0;});
    audio[i].play().catch(()=>{feedback.textContent='Запись не воспроизвелась. Нажмите на звук ещё раз.';});
    render(); persist();
  }));
  signs.forEach(button=>button.addEventListener('click',()=>{
    chosen[active]=button.dataset.sign; checked=false;
    const next=chosen.findIndex(x=>x===null); if(next>=0) active=next;
    render();persist();
  }));
  check.addEventListener('click',()=>{checked=true; const wrong=chosen.findIndex((s,i)=>s!==expected[i]); if(wrong>=0)active=wrong;render();persist();});
  restore(window.openai?.widgetState);render();
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
})();
</script>
