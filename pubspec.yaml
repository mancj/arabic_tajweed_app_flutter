name: my_app_template
description: "Your app description here"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  logger: ^2.0.2+1
  firebase_crashlytics: ^3.4.17
  get: ^4.6.6
  flutter_svg: ^2.0.9
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.2
  figma_squircle: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/fonts/Gilroy/

  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy/Gilroy-Regular.ttf
          weight: 400
        - asset: assets/fonts/Gilroy/Gilroy-Medium.ttf
          weight: 600
        - asset: assets/fonts/Gilroy/Gilroy-Semibold.ttf
          weight: 700
        - asset: assets/fonts/Gilroy/Gilroy-Bold.ttf
          weight: 800
