title: "Нун — ن"
blocks:
  - letter:
      glyph: "ن"
      audio: "audio/alphabet/nun.wav"
  - text: |
      Произносится как русское **«н»** в слове «нужно».

  - writing: |
      **ن** похожа на округлую чашу с **одной точкой сверху**.
  - sifat: |
      У **ن**, как и у **م**, есть **носовой оттенок — г'унна**:
      часть звука проходит через нос.
