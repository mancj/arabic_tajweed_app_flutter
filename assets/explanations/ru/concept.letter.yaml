title: "Вступление"
blocks:
  - text: |
      Во имя Аллаха, Милостивого, Милосердного.

      Ассаламу алайкум!

      Шаг за шагом вы научитесь читать арабские слова самостоятельно,
      даже если сейчас не знаете ни одной буквы.

      Вы узнаете, как одна точка меняет букву
      и как знаки над и под буквами подсказывают произношение.

      Этот первый блок посвящён алфавиту: будем слушать, произносить и писать
      буквы.

      Давайте сначала познакомимся с понятиями **махрадж** и **сифат**.
