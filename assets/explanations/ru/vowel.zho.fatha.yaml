title: "Зо с фатхой"
blocks:
  - letter:
      glyph: "ظَ"
      audio: "audio/harakat/zho_fatha.mp3"
  - text: |
      Послушайте и прочитайте: **ظَ**.

      **ظ** — межзубная буква с **объёмным звучанием**. С фатхой гласный
      приобретает **оттенок «о»**: слог на слух напоминает «зо».

      Слегка высуньте кончик языка между зубами и коснитесь им края верхних
      передних зубов, как для **ذ**. Приподнимите заднюю часть языка к нёбу
      и произнесите межзубное «з» с голосом.
      Сама буква звучит глубоко и твёрдо, а гласный остаётся кратким.
