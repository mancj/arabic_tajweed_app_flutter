title: "Дод с фатхой"
blocks:
  - letter:
      glyph: "ضَ"
      audio: "audio/harakat/dod_fatha.mp3"
  - text: |
      Послушайте и прочитайте: **ضَ**.

      **ض** — буква с **объёмным звучанием**. С фатхой гласный приобретает
      выраженный **оттенок «о»**: слог на слух напоминает «до».

      Прижмите боковые края языка к верхним коренным зубам и приподнимите заднюю часть языка к нёбу.
      Сама буква звучит глубоко и твёрдо, а гласный остаётся кратким.
