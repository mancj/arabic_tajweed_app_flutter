title: "Мим — م"
blocks:
  - letter:
      glyph: "م"
      audio: "audio/alphabet/mim.wav"
  - text: |
      Произносится как русское **«м»** в слове «мина».

  - writing: |
      У **م** небольшая округлая головка и длинный хвост, уходящий вниз.
      **Точек нет**.
  - sifat: |
      У **م** есть **носовой оттенок**: часть звука проходит через нос.
      Это свойство называется **г'унна**.
