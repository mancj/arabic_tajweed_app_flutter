title: "То с фатхой"
blocks:
  - letter:
      glyph: "طَ"
      audio: "audio/harakat/to_fatha.mp3"
  - text: |
      Послушайте и прочитайте: **طَ**.

      **ط** — буква с **объёмным звучанием**. С фатхой гласный приобретает
      **оттенок «о»**: слог на слух напоминает «то».

      Прижмите кончик языка к нёбу сразу за верхними передними зубами,
      как для **ت**, и приподнимите заднюю часть языка к нёбу.
      Сама буква звучит глубоко и твёрдо, а гласный остаётся кратким.
