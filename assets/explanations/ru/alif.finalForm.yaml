title: "Алиф в конце"
blocks:
  - letter:
      glyph: "ــا"
      audio: "audio/alphabet/alif.wav"
  - text: |
      Алиф в конце слова. Слева она и так ни с чем не соединяется, поэтому меняется только справа: появляется связка с предыдущей буквой.
  - word:
      text: "بابا"
      highlight: 1
      form: finalForm
