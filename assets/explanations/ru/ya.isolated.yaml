title: "Йа — ي"
blocks:
  - letter:
      glyph: "ي"
      audio: "audio/alphabet/ya.wav"
  - text: |
      Произносится как русское **«й»** в слове «йод».
      С гласным «а» **يَ** звучит как «я».

  - writing: |
      У **ي** небольшой верхний изгиб и широкая округлая нижняя часть.
      Снизу — **две точки**.
  - sifat: |
      **ي** произносится с голосом, легко, без объёмного оттенка.
