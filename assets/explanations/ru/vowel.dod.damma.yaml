title: "Дод с даммой"
blocks:
  - letter:
      glyph: "ضُ"
      audio: "audio/harakat/dod_damma.mp3"
  - text: |
      Послушайте и прочитайте: **ضُ**. Звук «у» краткий.

      С даммой **ض** произносится твёрдо, с **объёмным звучанием**.
      Приподнимите заднюю часть языка к нёбу: сама буква звучит глубже,
      а гласный «у» остаётся кратким.