title: "Шин — ش"
blocks:
  - letter:
      glyph: "ش"
      audio: "audio/alphabet/shin.wav"
  - text: |
      **ش** звучит мягко и напоминает русское **«щ»** в слове **«щит»**.

  - writing: |
      По форме такая же, как **س**, но сверху **три точки**.
  - sifat: |
      **ش** произносится без голоса. Воздух распространяется по рту,
      создавая шипящий шум. Звук можно тянуть.
