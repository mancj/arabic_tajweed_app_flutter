title: "Ро с даммой"
blocks:
  - letter:
      glyph: "رُ"
      audio: "audio/harakat/ra_damma.mp3"
  - text: |
      Послушайте и прочитайте: **رُ**. Звук «у» краткий.

      С даммой **ر** произносится твёрдо, с **объёмным звучанием**.
      Приподнимите заднюю часть языка к нёбу: сама буква звучит глубже,
      а гласный «у» остаётся кратким.
