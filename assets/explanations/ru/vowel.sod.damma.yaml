title: "Сод с даммой"
blocks:
  - letter:
      glyph: "صُ"
      audio: "audio/harakat/sod_damma.mp3"
  - text: |
      Послушайте и прочитайте: **صُ**. Звук «у» краткий.

      С даммой **ص** произносится твёрдо, с **объёмным звучанием**.
      Приподнимите заднюю часть языка к нёбу: сама буква звучит глубже,
      а гласный «у» остаётся кратким.
