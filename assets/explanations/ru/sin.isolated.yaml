title: "Син — س"
blocks:
  - letter:
      glyph: "س"
      audio: "audio/alphabet/sin.wav"
  - text: |
      **س** произносится как русское **«с»**, без смягчения.

  - writing: |
      У **س** три небольших зубца и округлая часть, похожая на чашу.
      **Точек нет**.
  - sifat: |
      **س** произносится без голоса, со свистящим оттенком. Звук можно плавно
      тянуть: «с-с-с».
