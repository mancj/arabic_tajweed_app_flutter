title: "Ро с фатхой"
blocks:
  - letter:
      glyph: "رَ"
      audio: "audio/harakat/ra_fatha.mp3"
  - text: |
      Послушайте и прочитайте: **رَ**.

      С фатхой **ر** произносится твёрдо, с **объёмным звучанием**.
      Гласный приобретает **оттенок «о»**: слог на слух напоминает «ро».

      Для объёмного звучания приподнимите заднюю часть языка к нёбу.
      Гласный остаётся кратким «а», но звучит глубже.
