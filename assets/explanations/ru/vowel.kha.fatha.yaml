title: "Хо с фатхой"
blocks:
  - letter:
      glyph: "خَ"
      audio: "audio/harakat/kha_fatha.mp3"
  - text: |
      Послушайте и прочитайте: **خَ**.

      **خ** — буква с **объёмным звучанием**. С фатхой она читается
      с **оттенком "о" вместо "а"**: слог на слух напоминает «хо».

      Для этого поднимите заднюю часть языка к нёбу.
      Гласный остаётся кратким «а», но приобретает более глубокий,
      твёрдый оттенок.
