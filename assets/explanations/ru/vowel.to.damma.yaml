title: "То с даммой"
blocks:
  - letter:
      glyph: "طُ"
      audio: "audio/harakat/to_damma.mp3"
  - text: |
      Послушайте и прочитайте: **طُ**. Звук «у» краткий.

      С даммой **ط** произносится твёрдо, с **объёмным звучанием**.
      Приподнимите заднюю часть языка к нёбу: сама буква звучит глубже,
      а гласный «у» остаётся кратким.
