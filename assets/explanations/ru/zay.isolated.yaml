title: "Зай — ز"
blocks:
  - letter:
      glyph: "ز"
      audio: "audio/alphabet/zay.wav"
  - text: |
      Произносится как русское **«з»** в слове «замок».

  - writing: |
      По форме такая же, как **ر**, но с **одной точкой сверху**.
  - sifat: |
      **ز** произносится с голосом и лёгким свистящим оттенком.
      Звук можно плавно тянуть: «з-з-з». Объёмного оттенка у него нет.
