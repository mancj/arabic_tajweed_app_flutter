title: "Коф с даммой"
blocks:
  - letter:
      glyph: "قُ"
      audio: "audio/harakat/qof_damma.mp3"
  - text: |
      Послушайте и прочитайте: **قُ**. Звук «у» краткий.

      С даммой **ق** произносится твёрдо, с **объёмным звучанием**.
      Приподнимите заднюю часть языка к нёбу: сама буква звучит глубже,
      а гласный «у» остаётся кратким.
