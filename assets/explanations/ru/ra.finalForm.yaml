title: "Ро в конце"
blocks:
  - letter:
      glyph: "ــر"
      audio: "audio/alphabet/ra.wav"
  - text: |
      Ро в конце слова. Слева она и так ни с чем не соединяется, поэтому меняется только справа: появляется связка с предыдущей буквой.
  - word:
      text: "بحر"
      highlight: 2
      form: finalForm
