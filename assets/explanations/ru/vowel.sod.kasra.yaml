title: "Сод с касрой"
blocks:
  - letter:
      glyph: "صِ"
      audio: "audio/harakat/sod_kasra.mp3"
  - text: |
      Послушайте и прочитайте: **صِ**.

      С касрой **ص** сохраняет **объёмное звучание**. Гласный «и»
      приобретает **оттенок «ы»**, а сама буква остаётся глубокой и твёрдой.

      Приподнимите заднюю часть языка к нёбу и сохраняйте это положение
      при произнесении слога. Гласный остаётся кратким.
