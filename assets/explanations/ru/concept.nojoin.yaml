title: "Буквы, которые не соединяются слева"
blocks:
  - text: |
      Шесть букв алфавита — **ا د ذ ر ز و** — **не соединяются со следующей буквой слева**: алиф, даль, заль, ро, зай и вав.

      Справа они могут соединяться, если предыдущая буква допускает соединение.
  - text: |
      ## Рассмотрим на примере Даль

      Даль не соединяется слева, поэтому в начале слова выглядит как отдельная: **د**. В середине, если есть соединение справа, она выглядит как конечная: **ـد**.
  - forms:
      - position: isolated
        glyph: "د"
      - position: initial
        glyph: "د"
        example: {text: "دار", highlight: 0}
      - position: medial
        glyph: "ـد"
        example: {text: "مدرسة", highlight: 1}
      - position: finalForm
        glyph: "ـد"
        example: {text: "يد", highlight: 1}
  - text: |
      Таким образом, каждая из этих букв имеет только **два начертания**: отдельное и соединённое с предыдущей буквой справа.
      
      В будущих конспектах мы рассмотрим каждую букву отдельно.
