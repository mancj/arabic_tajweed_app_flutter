title: "Дод с касрой"
blocks:
  - letter:
      glyph: "ضِ"
      audio: "audio/harakat/dod_kasra.mp3"
  - text: |
      Послушайте и прочитайте: **ضِ**.

      С касрой **ض** сохраняет **объёмное звучание**. Гласный «и»
      приобретает **оттенок «ы»**, а сама буква остаётся глубокой и твёрдой.

      Прижмите боковые края языка к верхним коренным зубам и приподнимите заднюю часть языка к нёбу.
      Сохраняйте это положение при произнесении слога. Гласный остаётся кратким.
