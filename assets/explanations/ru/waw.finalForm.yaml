title: "Вав в конце"
blocks:
  - letter:
      glyph: "ــو"
      audio: "audio/alphabet/waw.wav"
  - text: |
      Вав в конце слова. Слева она и так ни с чем не соединяется, поэтому меняется только справа: появляется связка с предыдущей буквой.
  - word:
      text: "دلو"
      highlight: 2
      form: finalForm
