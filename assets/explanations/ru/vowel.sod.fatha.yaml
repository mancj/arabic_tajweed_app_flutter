title: "Сод с фатхой"
blocks:
  - letter:
      glyph: "صَ"
      audio: "audio/harakat/sod_fatha.mp3"
  - text: |
      Послушайте и прочитайте: **صَ**.

      **ص** — буква с **объёмным звучанием**. С фатхой гласный приобретает
      **оттенок «о»**: слог на слух напоминает «со».

      Приподнимите заднюю часть языка к нёбу и произнесите «с».
      Сама буква звучит глубоко и твёрдо, а гласный остаётся кратким.
