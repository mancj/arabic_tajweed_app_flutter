title: "Ха — ه"
blocks:
  - letter:
      glyph: "ه"
      audio: "audio/alphabet/ha.wav"
  - text: |
      На слух **ه** напоминает **лёгкий выдох**, как будто вы согреваете
      руки дыханием.

  - writing: |
      **ه** похожа на небольшую замкнутую петлю. **Точек нет**.
  - makhraj: |
      Звук образуется глубоко в горле. Откройте рот и плавно выдохните,
      оставляя проход свободным. Язык к нёбу не прижимайте.

      В отличие от **ح**, здесь не нужно специально сужать горло.
  - sifat: |
      **ه** произносится без голоса — слышен только шум выдоха.
      Воздух идёт непрерывно, поэтому звук можно плавно тянуть.
