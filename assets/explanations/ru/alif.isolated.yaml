title: "Алиф — ا"
blocks:
  - letter:
      glyph: "ا"
      audio: "audio/alphabet/alif.wav"
  - text: |
      Алиф удлиняет звук «а» после предыдущей буквы: **بَا — «баа»**.

      ## Как пишется

      Алиф — вертикальная черта без точек. Пишите её сверху вниз.
  - makhraj: |
      Звук алифа проходит через полость горла и рта. Рот открыт, язык и губы не
      перекрывают его путь — «аа» звучит свободно, без смыкания.
      [Источник](https://tajweed.quranpedia.net/lessons/show/content/18).
  - sifat: |
      Алиф произносится с голосом: звук тянется плавно и непрерывно. Не нужно
      добавлять придыхание или носовой оттенок.
      [О свойствах](https://tajweed.quranpedia.net/lessons/show/content/19).

      Его звучание зависит от предыдущей буквы: после тонкой — тонкое, после
      утолщённой — более глубокое, утолщённое.
      [Об этом правиле](https://tajweed.quranpedia.net/lessons/show/content/20).

      **Обратите внимание:** алиф ا и хамза ء — разные буквы. Здесь мы изучаем
      алиф, который удлиняет «а».
