title: "Зо с даммой"
blocks:
  - letter:
      glyph: "ظُ"
      audio: "audio/harakat/zho_damma.mp3"
  - text: |
      Послушайте и прочитайте: **ظُ**. Звук «у» краткий.

      С даммой **ظ** произносится твёрдо, с **объёмным звучанием**.
      Приподнимите заднюю часть языка к нёбу: сама буква звучит глубже,
      а гласный «у» остаётся кратким.
