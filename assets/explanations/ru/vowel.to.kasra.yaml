title: "То с касрой"
blocks:
  - letter:
      glyph: "طِ"
      audio: "audio/harakat/to_kasra.mp3"
  - text: |
      Послушайте и прочитайте: **طِ**.

      С касрой **ط** сохраняет **объёмное звучание**. Гласный «и»
      приобретает **оттенок «ы»**, а сама буква остаётся глубокой и твёрдой.

      Прижмите кончик языка к нёбу сразу за верхними передними зубами,
      как для **ت**, и приподнимите заднюю часть языка к нёбу.
      Сохраняйте это положение при произнесении слога. Гласный остаётся кратким.
