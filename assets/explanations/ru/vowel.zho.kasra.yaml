title: "Зо с касрой"
blocks:
  - letter:
      glyph: "ظِ"
      audio: "audio/harakat/zho_kasra.mp3"
  - text: |
      Послушайте и прочитайте: **ظِ**.

      С касрой **ظ** сохраняет **объёмное звучание**. Гласный «и»
      приобретает **оттенок «ы»**, а сама буква остаётся глубокой и твёрдой.

      Слегка высуньте кончик языка между зубами и коснитесь им края верхних
      передних зубов, как для **ذ**. Приподнимите заднюю часть языка к нёбу
      и произнесите межзубное «з» с голосом.
      Сохраняйте это положение при произнесении слога. Гласный остаётся кратким.
