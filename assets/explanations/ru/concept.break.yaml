title: "Разрыв в слове"
blocks:
  - text: |
      Мы уже знаем, что буквы **ا د ذ ر ز و** не соединяются со следующей буквой. Из-за этого буква в словае начинается заново, хотя слово продолжается.

      **Такой разрыв — не пробел и не пауза при чтении.**
  - text: |
      В **درس** два разрыва — после даль и ро. Все три буквы пишутся отдельно, но это **одно слово**:
  - word: {text: "درس", highlight: 1, form: isolated}
  - text: |
      В **ترك** ро соединяется с та **справа**, но не соединяется с каф **слева**. Она выглядит как конечная **ـر**, хотя стоит в середине слова:
  - word: {text: "ترك", highlight: 1, form: finalForm}
  - text: |
      В **دخل** после даль идёт ха **خ**. Она соединяется с лам слева, поэтому имеет **начальную форму**, хотя стоит в середине слова:
  - word: {text: "دخل", highlight: 1, form: initial}
  - text: |
      В **شرب** после ро идёт последняя ба. Справа соединения нет, поэтому она пишется **отдельно**, а не в конечной форме:
  - word: {text: "شرب", highlight: 2, form: isolated}
