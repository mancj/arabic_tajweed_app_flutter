title: "Читаем слова"
blocks:
  - text: |
      Теперь читаем целые слова на знакомых буквах и трёх огласовках. Новых знаков пока нет.

      Начнём с двух букв. Читайте справа налево, соединяя их звуки. В заданиях нужно выбрать подходящие формы букв и услышанные огласовки.

      В полной сборке сначала выберите формы всех букв, затем добавьте огласовки по звуку. Количество мест видно сразу.
